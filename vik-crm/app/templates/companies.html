{% extends "base.html" %}
{% block content %}
<h1>Клиенты</h1>
<form class="inline" method="get"><input name="q" value="{{ q }}" placeholder="Название или ИНН"><button>Найти</button></form>
<div class="tbl"><table>
  <tr><th>Название</th><th>ИНН</th><th>Город</th><th>Источник</th></tr>
  {% for c in items %}<tr><td><a href="/companies/{{ c.id }}">{{ c.name }}</a></td><td>{{ c.inn }}</td><td>{{ c.city }}</td><td>{{ c.source }}</td></tr>
  {% else %}<tr><td colspan="4" class="muted">Ничего не найдено</td></tr>{% endfor %}
</table></div>
{% if user.role.value != 'viewer' %}
<h2>Новый клиент</h2>
<form method="post" action="/companies" class="card form">
  <input type="hidden" name="csrf" value="{{ csrf(request) }}">
  <label>Название<input name="name" required></label>
  <label>ИНН<input name="inn"></label>
  <label>ОКВЭД<input name="okved"></label>
  <label>Сайт<input name="site"></label>
  <label>Город<input name="city"></label>
  <label>Заметки<textarea name="notes" rows="2"></textarea></label>
  <button>Создать</button>
</form>
{% endif %}
{% endblock %}
