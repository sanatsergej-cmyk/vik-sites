{% extends "base.html" %}
{% block content %}
<div class="head"><div><h1>Быстрое добавление</h1><p class="muted">Одна форма создаёт клиента, контакт и сделку. Если такой телефон, email или Telegram уже есть, сделка привяжется к существующему клиенту.</p></div></div>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/quick" class="card form" style="max-width:720px">
  <input type="hidden" name="csrf" value="{{ csrf(request) }}">
  <div class="two">
    <label>Компания<input name="company" autofocus></label>
    <label>Контактное лицо<input name="contact_name"></label>
    <label>Телефон<input name="phone" inputmode="tel"></label>
    <label>Email<input name="email" type="email"></label>
    <label>Telegram<input name="telegram" placeholder="@username"></label>
    <label>Вид работ
      <select name="service">
        <option value="">Не выбрано</option>
        <optgroup label="Приоритетные">{% for s in SERVICES if s.priority %}<option value="{{ s.id }}">{{ s.label }}</option>{% endfor %}</optgroup>
        <optgroup label="Остальные">{% for s in SERVICES if not s.priority %}<option value="{{ s.id }}">{{ s.label }}</option>{% endfor %}</optgroup>
      </select>
    </label>
    <label>Название объекта / сделки<input name="title"></label>
    <label>Ожидаемая сумма, ₽<input name="amount" inputmode="decimal"></label>
  </div>
  <label>Заметка<textarea name="note" rows="3" placeholder="Что запросили, откуда пришли, о чём договорились"></textarea></label>
  <button>Создать сделку</button>
</form>
{% endblock %}
